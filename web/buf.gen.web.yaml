version: v2
# Generates the TypeScript client from the same protos as the Go backend.
# Connect-ES v2 needs only protoc-gen-es: it emits the service descriptors,
# and @connectrpc/connect's createClient consumes them directly.
managed:
  enabled: true
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt:
      - target=ts
      - import_extension=js
